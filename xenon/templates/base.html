<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Custom range slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #27272a; border-radius: 2px; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#3b82f6',
                            bg: '#09090b',
                            surface: '#18181b',
                            border: '#27272a',
                            text: '#f4f4f5',
                            muted: '#a1a1aa'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-brand-bg text-brand-text h-screen flex flex-col overflow-hidden font-sans selection:bg-brand selection:text-white">

    <!-- Studio Navbar -->
    <header class="h-14 bg-brand-bg border-b border-brand-border flex items-center justify-between px-6 shrink-0 z-50">
        <!-- Left: Logo -->
        <a href="{% url 'landing_page' %}" class="flex items-center space-x-3 hover:opacity-80 transition-opacity">
            <div class="w-7 h-7 rounded bg-brand flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <span class="font-bold text-brand-text tracking-tight text-lg">Xenon Studio</span>
        </a>

        <!-- Middle: Links -->
        <nav class="flex items-center space-x-1">
            <a href="{% url 'video_studio' %}" class="px-5 py-1.5 text-sm font-medium {% if request.resolver_match.url_name == 'video_studio' %}text-brand bg-brand/10 rounded-full{% else %}text-brand-muted hover:text-brand-text{% endif %} transition-colors">Video</a>
        </nav>

        <!-- Right: Assets & Account -->
        <div class="flex items-center space-x-4">
            <a href="{% url 'assets' %}" class="flex items-center space-x-1.5 px-3 py-1.5 text-sm font-medium {% if request.resolver_match.url_name == 'assets' %}text-brand bg-brand/10 rounded-full{% else %}text-brand-muted hover:text-brand-text{% endif %} transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                <span>Assets</span>
            </a>
            <div class="w-px h-5 bg-brand-border"></div>
            <!-- User Placeholder -->
            <button class="w-8 h-8 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center hover:border-brand-muted transition-colors">
                <svg class="w-4 h-4 text-brand-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex overflow-hidden relative">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        window.showToast = function(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-500' : 'bg-brand';
            toast.className = \ text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 pointer-events-auto transform transition-all duration-300 translate-y-8 opacity-0\;
            toast.innerHTML =                 <span class="text-sm font-medium">\</span>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white ml-2 shrink-0">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            \;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-8', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
