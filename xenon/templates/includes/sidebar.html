<aside class="w-20 lg:w-64 bg-brand-bg border-r border-brand-border flex flex-col h-full shrink-0 transition-all duration-300">
    <!-- Logo -->
    <div class="h-16 flex items-center justify-center lg:justify-start lg:px-6 shrink-0">
        <div class="w-8 h-8 rounded bg-brand flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-brand-text ml-3 hidden lg:block"><strong>Xenon Studio</strong></span>
    </div>

    <div class="p-3 lg:p-4 flex-1">
        <ul class="space-y-2">
            <li>
                <a href="#" class="flex items-center justify-center lg:justify-start space-x-3 px-3 py-3 rounded-lg bg-brand-surface text-brand-text font-medium border border-brand-border hover:bg-brand/10 transition-colors">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="hidden lg:block">New Chat</span>
                </a>
            </li>
            {% comment %} <li class="pt-4 pb-2 hidden lg:block">
                <p class="text-xs font-semibold text-brand-muted uppercase tracking-wider px-3">History</p>
            </li>
            <li>
                <a href="#" class="flex items-center justify-center lg:justify-start space-x-3 px-3 py-2.5 rounded-lg text-brand-muted hover:bg-brand-surface hover:text-brand-text transition-colors">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path></svg>
                    <span class="hidden lg:block truncate"> Projects</span>
                </a>
            </li> {% endcomment %}
        </ul>
    </div>
    
    <!-- User -->
    <div class="p-4 border-t border-brand-border">
        <div class="flex items-center justify-center lg:justify-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center text-brand-muted shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div class="hidden lg:block">
                <p class="text-sm font-medium text-brand-text">User Name</p>
            </div>
        </div>
    </div>
</aside>
