<aside class="w-64 bg-brand-bg border-r border-brand-border flex flex-col h-full shrink-0 transition-all duration-300">
    <!-- Logo -->
    <div class="h-16 flex items-center justify-start px-6 shrink-0 md:border-b-0 border-b border-brand-border">
        <div class="w-8 h-8 rounded bg-brand flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-brand-text ml-3 block"><strong>Xenon Studio</strong></span>
    </div>

    <div class="p-4 flex-1 overflow-y-auto">
        <ul class="space-y-2">
            <li>
                <a href="{% url 'new_chat' %}" class="flex items-center justify-start space-x-3 px-3 py-3 rounded-lg bg-brand-surface text-brand-text font-medium border border-brand-border hover:bg-brand/10 transition-colors">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span class="block">New Chat</span>
                </a>
            </li>
            <li class="pt-4 pb-2 block">
                <p class="text-xs font-semibold text-brand-muted uppercase tracking-wider px-3">History</p>
            </li>
            
            {% for chat in chat_sessions %}
            <li class="group relative flex items-center">
                <a href="{% url 'chat_session' chat.id %}" class="flex-1 flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors {% if active_chat and active_chat.id == chat.id %}bg-brand-surface text-brand-text border border-brand-border/50{% else %}text-brand-muted hover:bg-brand-surface hover:text-brand-text{% endif %} pr-16 overflow-hidden">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    
                    <!-- Display Title -->
                    <span class="block truncate title-display" id="title-display-{{ chat.id }}">{{ chat.title }}</span>
                    
                    <!-- Rename Input (Hidden by default) -->
                    <form action="{% url 'chat_rename' chat.id %}" method="POST" class="hidden title-edit-form w-full" id="title-edit-{{ chat.id }}">
                        {% csrf_token %}
                        <input type="text" name="title" value="{{ chat.title }}" class="bg-transparent border-b border-brand-text focus:outline-none text-brand-text w-full text-sm" onclick="event.preventDefault();" onblur="this.form.submit()">
                    </form>
                </a>
                
                <!-- Action Buttons (Visible on hover) -->
                <div class="flex absolute right-2 opacity-0 group-hover:opacity-100 transition-opacity items-center space-x-1 bg-gradient-to-l from-brand-bg via-brand-bg to-transparent pl-4 pb-0.5">
                    <button type="button" class="p-1.5 text-brand-muted hover:text-white rounded transition-colors" onclick="toggleEdit('{{ chat.id }}', event)" title="Rename">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>
                    <form action="{% url 'chat_delete' chat.id %}" method="POST" class="inline" onsubmit="event.preventDefault(); const form = this; customConfirm('Delete Chat', 'Are you sure you want to delete this chat?', (confirmed) => { if (confirmed) form.submit(); });">
                        {% csrf_token %}
                        <button type="submit" class="p-1.5 text-brand-muted hover:text-red-400 rounded transition-colors" title="Delete">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </form>
                </div>
            </li>
            {% endfor %}
            
            <script>
                function toggleEdit(chatId, event) {
                    event.preventDefault();
                    event.stopPropagation();
                    const display = document.getElementById('title-display-' + chatId);
                    const form = document.getElementById('title-edit-' + chatId);
                    const input = form.querySelector('input');
                    
                    display.classList.add('hidden');
                    form.classList.remove('hidden');
                    input.focus();
                    
                    // Select all text
                    input.setSelectionRange(0, input.value.length);
                }
            </script>
        </ul>
    </div>
    
    <!-- User -->
    <div class="p-4 border-t border-brand-border">
        <div class="flex items-center justify-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center text-brand-muted shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div class="block">
                <p class="text-sm font-medium text-brand-text">User Name</p>
            </div>
        </div>
    </div>
</aside>
