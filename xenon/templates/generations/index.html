{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Generate Video</h2>
        <form id="generateForm" class="space-y-6" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label for="prompt" class="block text-sm font-medium text-gray-700">Prompt</label>
                <textarea id="prompt" name="prompt" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="Describe the video you want to generate..." required></textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-md">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Aspect Ratio</label>
                    <select name="ratio" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                        <option value="16:9">16:9 (Landscape)</option>
                        <option value="9:16">9:16 (Portrait)</option>
                        <option value="1:1">1:1 (Square)</option>
                        <option value="4:3">4:3</option>
                        <option value="3:4">3:4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Duration (seconds)</label>
                    <input type="number" name="duration" value="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                </div>
                
                <div class="md:col-span-2">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">Reference Media (Optional)</h4>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-500">Reference Image</label>
                            <input type="file" name="reference_image" accept="image/*" class="text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500">Reference Video</label>
                            <input type="file" name="reference_video" accept="video/*" class="text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500">Reference Audio</label>
                            <input type="file" name="reference_audio" accept="audio/*" class="text-sm">
                        </div>
                    </div>
                </div>

                <div class="md:col-span-2 flex items-center space-x-6 mt-2">
                    <label class="flex items-center text-sm text-gray-700">
                        <input type="checkbox" name="generate_audio" value="true" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2">
                        Generate Audio
                    </label>
                    <label class="flex items-center text-sm text-gray-700">
                        <input type="checkbox" name="watermark" value="true" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2">
                        Watermark
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Generate
            </button>
        </form>
    </div>

    <div id="statusContainer" class="hidden bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-medium text-gray-900 mb-4">Generation Status</h3>
        <div id="statusText" class="text-sm font-semibold text-gray-600 mb-2">QUEUED</div>
        
        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4 overflow-hidden">
            <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full w-0 transition-all duration-500"></div>
        </div>

        <div id="videoContainer" class="hidden mt-6">
            <video id="resultVideo" controls class="w-full rounded-lg shadow-lg">
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div id="errorContainer" class="hidden mt-4 p-4 bg-red-50 text-red-700 rounded-md text-sm">
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const form = document.getElementById('generateForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const videoContainer = document.getElementById('videoContainer');
    const resultVideo = document.getElementById('resultVideo');
    const errorContainer = document.getElementById('errorContainer');
    
    let pollInterval = null;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const prompt = document.getElementById('prompt').value;
        if (!prompt) return;

        // Reset UI
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
        statusContainer.classList.remove('hidden');
        videoContainer.classList.add('hidden');
        errorContainer.classList.add('hidden');
        statusText.textContent = 'QUEUED';
        progressBar.style.width = '10%';
        progressBar.classList.add('animate-pulse');

        const formData = new FormData(form);
        // Remove empty files so Django doesn't process empty fields
        if (formData.get('reference_image').size === 0) formData.delete('reference_image');
        if (formData.get('reference_video').size === 0) formData.delete('reference_video');
        if (formData.get('reference_audio').size === 0) formData.delete('reference_audio');

        try {
            const response = await fetch('/generations/create/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            });

            const data = await response.json();
            
            if (response.ok) {
                startPolling(data.generation_id);
            } else {
                showError(data.error || 'Failed to submit generation task.');
            }
        } catch (err) {
            showError('Network error occurred.');
        }
    });

    function startPolling(generationId) {
        if (pollInterval) clearInterval(pollInterval);
        
        submitBtn.textContent = 'Generating...';
        
        pollInterval = setInterval(async () => {
            try {
                const response = await fetch(`/generations/status/${generationId}/`);
                const data = await response.json();
                
                statusText.textContent = data.status;
                
                if (data.status === 'PROCESSING') {
                    progressBar.style.width = '50%';
                } else if (data.status === 'COMPLETED') {
                    clearInterval(pollInterval);
                    progressBar.style.width = '100%';
                    progressBar.classList.remove('animate-pulse');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Generate Again';
                    
                    if (data.video_url) {
                        resultVideo.src = data.video_url;
                        videoContainer.classList.remove('hidden');
                    }
                } else if (data.status === 'FAILED') {
                    clearInterval(pollInterval);
                    progressBar.classList.remove('animate-pulse');
                    progressBar.classList.add('bg-red-500');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Generate';
                    showError(data.error_message || 'Generation failed.');
                }
            } catch (err) {
                console.error('Polling error', err);
            }
        }, 5000); // poll every 5 seconds
    }

    function showError(msg) {
        errorContainer.textContent = msg;
        errorContainer.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate';
    }
</script>
{% endblock %}
